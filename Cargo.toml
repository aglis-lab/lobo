[package]
name = "lobo"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["cpu"]
cpu = [
  "dep:renderer-cpu",
  "dep:winit",
  "dep:softbuffer",
  "dep:raw-window-handle",
  "dep:objc2",
  "dep:objc2-quartz-core",
]

[dependencies]
anim = { path = "anim" }
anymap3 = "1.1.0"
rand = "0.10.4"
taffy = "0.16"
tokio = { version = "1.54.1", features = ["full"] }
lobo-macros = { path = "lobo-macros" }
renderer = { path = "renderer" }
renderer-cpu = { path = "renderer-cpu", optional = true }
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }
log = "0.4.35"
serde = "1.0.229"
serde_json = "1.0.154"
anyhow = "1.0.104"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-quartz-core = { version = "0.3", optional = true }

[workspace]
members = ["anim", "lobo-macros", "renderer", "renderer-cpu", "renderer-gpu"]

[dev-dependencies]
dotenvy = "0.15.7"
env_logger = "0.11.12"

# Optimize dependencies and the CPU pixel renderer in dev builds so software
# rasterization (vello_cpu), text shaping (parley/harfrust), and pixel blits
# stay responsive during interactive window resize.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.renderer-cpu]
opt-level = 2
