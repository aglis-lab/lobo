[package]
name = "lobo"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anymap3 = "1.1.0"
rand = "0.10.4"
tokio = { version = "1.54.1", features = ["full"] }
lobo-macros = { path = "lobo-macros" }
log = "0.4.35"
serde = "1.0.229"
serde_json = "1.0.154"
anyhow = "1.0.104"
crossterm = "0.29.0"

[workspace]
members = ["lobo-macros", "renderer", "renderer-cpu", "renderer-gpu"]

[dev-dependencies]
dotenvy = "0.15.7"
env_logger = "0.11.12"
